# ---------------------------------------------------------------------------
# 通用构建配置（不含任何设备专属绝对路径）
#
# aapt2：Android SDK build-tools 内置的 aapt2 是 x86-64 ELF，在 aarch64 手机
#        上无法执行。本项目通过 env.sh 注入
#        -Dorg.gradle.project.android.aapt2FromMavenOverride=<Termux aarch64 aapt2>
#        或由命令行 -P 传入，因此不在此文件写死路径。
# ---------------------------------------------------------------------------

# 内存与并发：本机可用内存紧张（10 GiB 总内存，常驻占用高），保守配置
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

# AndroidX / R 类
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
