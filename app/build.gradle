plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.mengyalife.app'
    compileSdk 35
    buildToolsVersion '35.0.1'

    defaultConfig {
        applicationId 'com.mengyalife.app'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.15.1-morrow'

        // Gate 2C：QA 构建通过独立 applicationId + 独立库名做真机破坏性测试，
        // 保证测试永远不会碰正式版里用户自己的日记与目标。
        buildConfigField 'String', 'DATABASE_NAME', '"mengya-life.db"'
        buildConfigField 'String', 'PREFS_NAME', '"mengya_settings"'
        // Gate 3A：AI 配置与密钥别名也必须按构建类型隔离
        buildConfigField 'String', 'AI_PREFS_NAME', '"mengya_ai"'
        buildConfigField 'String', 'AI_KEY_ALIAS', '"mengya_ai_key"'
        buildConfigField 'String', 'CONSENT_PREFS_NAME', '"mengya_consent"'
        buildConfigField 'boolean', 'QA_BUILD', 'false'
        manifestPlaceholders = [appLabel: '萌芽人生']
    }

    // 固定调试签名来源：使用仓库内的 debug keystore，保证后续能覆盖安装。
    // 这是**调试**密钥（口令公开），绝不能用于发布；发布签名另行管理。
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/mengya-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }

        // 真机测试专用构建：包名 com.mengyalife.app.qa、库名 mengya-life-qa.db。
        // 与正式版可同时安装、互不共享数据；破坏性用例只允许跑在这个包上。
        create('qa') {
            initWith(getByName('debug'))
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            manifestPlaceholders = [appLabel: '萌芽人生 QA']
            buildConfigField 'String', 'DATABASE_NAME', '"mengya-life-qa.db"'
            buildConfigField 'String', 'PREFS_NAME', '"mengya_settings_qa"'
            buildConfigField 'String', 'AI_PREFS_NAME', '"mengya_ai_qa"'
            buildConfigField 'String', 'AI_KEY_ALIAS', '"mengya_ai_key_qa"'
            buildConfigField 'String', 'CONSENT_PREFS_NAME', '"mengya_consent_qa"'
            buildConfigField 'boolean', 'QA_BUILD', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        // 版本号 / 库名 / QA 标记由构建类型注入，避免把测试库写死进正式版。
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

// Room 导出 schema JSON：后续版本升级数据库时用它做迁移 diff，
// 不依赖「删库重建」，也不允许破坏性迁移。
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.generateKotlin', 'true')
}

// Gate 3A：新增用户自带 Key 的 AI 请求；仍无自有后端、无云同步。
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    // 生命周期：ViewModel + Compose 状态收集
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'

    // 本地数据库（KSP 生成实现）
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'

    // 每周回顾：可靠后台调度（唯一周期任务，无外网 AI）
    implementation 'androidx.work:work-runtime-ktx:2.10.1'

    // 偏好设置（主题）
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

    // 结构化导出（只用到 JSON 构建与解析 API，不引入序列化编译器插件）
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // JVM 单元测试（不依赖真机）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
